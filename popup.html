<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gemini Translator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #1f2328;
      width: 400px;
      min-height: 200px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      background: #fafbff;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: #1a73e8;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #1f2328;
      letter-spacing: -0.01em;
      flex: 1;
    }

    .header-settings {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      border-radius: 5px;
      cursor: pointer;
      color: #5f6368;
      transition: background 0.12s, color 0.12s;
      padding: 0;
      text-decoration: none;
    }
    .header-settings:hover { background: #f1f3f4; color: #202124; }

    /* ── Input area ── */
    .input-section {
      padding: 14px 16px 0;
    }

    .input-label {
      font-size: 11px;
      font-weight: 600;
      color: #80868b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 96px;
      max-height: 200px;
      padding: 10px 12px;
      border: 1px solid #dadce0;
      border-radius: 7px;
      font-size: 13.5px;
      line-height: 1.6;
      color: #1f2328;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }

    textarea:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
    }

    textarea::placeholder { color: #bdc1c6; }

    .char-count {
      font-size: 11px;
      color: #bdc1c6;
      text-align: right;
      margin-top: 4px;
    }

    /* ── Action row ── */
    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 14px;
    }

    .translate-btn {
      flex: 1;
      padding: 9px 16px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: background 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .translate-btn:hover { background: #1557b0; box-shadow: 0 2px 8px rgba(26,115,232,0.3); }
    .translate-btn:active { background: #0d47a1; }
    .translate-btn:disabled { background: #c5cae9; cursor: not-allowed; box-shadow: none; }

    .clear-btn {
      padding: 9px 14px;
      background: transparent;
      border: 1px solid #dadce0;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: #5f6368;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, color 0.12s;
    }
    .clear-btn:hover { background: #f1f3f4; color: #202124; }

    /* ── Result section ── */
    .result-section {
      border-top: 1px solid #f0f0f0;
      display: none;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 8px;
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #1a73e8;
      background: #e8f0fe;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .result-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 500;
      color: #5f6368;
      background: transparent;
      border: 1px solid #dadce0;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, color 0.12s;
    }
    .result-action-btn:hover { background: #f1f3f4; color: #202124; }
    .result-action-btn.copied { color: #188038; border-color: #ceead6; background: #e6f4ea; }

    .result-body {
      padding: 0 16px 16px;
      font-size: 13.5px;
      line-height: 1.68;
      color: #1f2328;
      max-height: 320px;
      overflow-y: auto;
      word-break: break-word;
    }

    /* Custom scrollbar */
    .result-body::-webkit-scrollbar { width: 5px; }
    .result-body::-webkit-scrollbar-track { background: transparent; }
    .result-body::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 4px; }

    /* Error state */
    .result-body.is-error { color: #c5221f; }
    .error-hint { margin-top: 8px; font-size: 12px; color: #80868b; }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #5f6368;
      font-size: 13px;
      padding: 4px 0;
    }
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid #e0e0e0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Markdown elements */
    .result-body p { margin: 0 0 6px; }
    .result-body p:last-child { margin-bottom: 0; }
    .result-body .spacer { height: 7px; }
    .result-body h1, .result-body h2, .result-body h3 {
      font-weight: 700; color: #1f2328;
      margin: 10px 0 4px; line-height: 1.3; letter-spacing: -0.02em;
    }
    .result-body h1 { font-size: 16px; }
    .result-body h2 { font-size: 14.5px; }
    .result-body h3 { font-size: 13.5px; }
    .result-body ul, .result-body ol { padding-left: 18px; margin: 4px 0 6px; }
    .result-body li { margin-bottom: 3px; line-height: 1.6; }
    .result-body pre {
      background: #f6f8fa; border: 1px solid #e8eaed; border-radius: 6px;
      padding: 8px 10px; margin: 6px 0; overflow-x: auto;
      font-size: 12px; line-height: 1.55;
    }
    .result-body pre code { background: transparent; border: none; padding: 0; font-family: 'SF Mono', 'Fira Code', Consolas, monospace; }
    .result-body code {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12px; background: #f0f4f8; border: 1px solid #e4e7eb;
      padding: 1px 4px; border-radius: 4px; color: #c0392b;
    }
    .result-body blockquote {
      margin: 5px 0; padding: 5px 10px;
      border-left: 3px solid #1a73e8; background: #f0f5ff;
      border-radius: 0 4px 4px 0; color: #3c4043; font-style: italic;
    }
    .result-body hr { border: none; border-top: 1px solid #e0e0e0; margin: 8px 0; }
    .result-body strong { font-weight: 700; }
    .result-body em { font-style: italic; }
    .result-body del { text-decoration: line-through; color: #80868b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="15" height="15" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 4.5H10M10 4.5L7.5 2M10 4.5L7.5 7" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 9.5H4M4 9.5L6.5 7M4 9.5L6.5 12" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="header-title">Gemini Translator</span>
    <a id="settingsBtn" class="header-settings" title="Cài đặt (API Key, Model)" href="#" target="_blank">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </a>
  </div>

  <div class="input-section">
    <div class="input-label">Text to translate</div>
    <textarea id="inputText" placeholder="Paste or type English text here…" spellcheck="false"></textarea>
    <div class="char-count" id="charCount">0 chars</div>
  </div>

  <div class="action-row">
    <button class="translate-btn" id="translateBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 4.5H10M10 4.5L7.5 2M10 4.5L7.5 7" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 9.5H4M4 9.5L6.5 7M4 9.5L6.5 12" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Translate
    </button>
    <button class="clear-btn" id="clearBtn">Clear</button>
  </div>

  <div class="result-section" id="resultSection">
    <div class="result-header">
      <span class="result-badge">EN → VI</span>
      <div class="result-actions">
        <button class="result-action-btn" id="speakBtn">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="2 5 6 5 10 2 10 14 6 11 2 11 2 5"></polygon>
            <path d="M13 5.5a5 5 0 0 1 0 5"></path>
          </svg>
          Listen
        </button>
        <button class="result-action-btn" id="copyBtn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <rect x="4" y="4" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.3"/>
            <path d="M3 8H2a1 1 0 01-1-1V2a1 1 0 011-1h5a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          Copy
        </button>
      </div>
    </div>
    <div class="result-body" id="resultBody"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
